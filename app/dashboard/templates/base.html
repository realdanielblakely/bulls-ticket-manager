<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Bulls Ticket Manager{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <nav class="bg-slate-900 border-b border-slate-800 px-6 py-4 sticky top-0 z-10">
    <div class="max-w-6xl mx-auto flex items-center gap-3">
      <span class="text-2xl leading-none">🐂</span>
      <span class="font-bold text-white text-lg tracking-tight">Bulls Ticket Manager</span>
      <span class="text-slate-500 text-sm hidden sm:inline">— Durham Bulls 2026</span>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
